name: Build MiFlashX for Linux

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

jobs:
  build-linux:
    runs-on: ubuntu-latest # Specify the runner environment (latest Ubuntu LTS)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Action to check out your repository code

    - name: Set up Python
      uses: actions/setup-python@v5 # Action to set up Python environment
      with:
        python-version: '3.10' # Specify the Python version you want to use (e.g., '3.9', '3.10', '3.11')

    - name: Install Python dependencies
      run: |
        # Upgrade pip to ensure latest version
        pip install --upgrade pip
        # Install project-specific Python libraries
        pip install PyQt6 Pillow pyinstaller

    - name: Download and extract Android Platform Tools
      run: |
        # Define the URL for the latest Linux platform-tools
        PLATFORM_TOOLS_URL="https://dl.google.com/android/repository/platform-tools-latest-linux.zip"
        
        # Create the directory for platform-tools
        mkdir -p platform-tools
        
        # Download the zip file
        echo "Downloading Android Platform Tools from ${PLATFORM_TOOLS_URL}..."
        curl -L ${PLATFORM_TOOLS_URL} -o platform-tools.zip
        
        # Unzip the contents into the platform-tools directory
        echo "Extracting platform-tools.zip..."
        unzip -q platform-tools.zip -d platform-tools/
        
        # The zip usually extracts to a nested 'platform-tools/platform-tools/' directory.
        # Move contents up one level and remove the nested directory.
        mv platform-tools/platform-tools/* platform-tools/
        rmdir platform-tools/platform-tools
        
        # Ensure adb and fastboot binaries are executable
        chmod +x platform-tools/adb platform-tools/fastboot
        echo "Android Platform Tools prepared."

    - name: Generate Application Icon
      # Run your Python script to create the icon.png in the assets folder
      run: python generate_icon.py
      # The generate_icon.py script will automatically create the 'assets' folder if it doesn't exist.

    - name: Make build script executable
      # Ensure your build_linux.sh script has executable permissions
      run: chmod +x build_scripts/build_linux.sh

    - name: Run PyInstaller build script
      # Execute your build script to compile the application
      run: ./build_scripts/build_linux.sh

    - name: Upload MiFlashX executable as artifact
      uses: actions/upload-artifact@v4 # Action to upload build artifacts
      with:
        name: MiFlashX-Linux-Executable # Name of the artifact
        path: dist/MiFlashX             # Path to the compiled executable
        retention-days: 7               # How long to keep the artifact (e.g., 7 days)
