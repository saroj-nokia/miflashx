name: Build MiFlashX for Linux

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

jobs:
  build-linux:
    runs-on: ubuntu-latest # Specify the runner environment (latest Ubuntu LTS)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Action to check out your repository code

    - name: Set up Python
      uses: actions/setup-python@v5 # Action to set up Python environment
      with:
        python-version: '3.10' # Specify the Python version you want to use (e.g., '3.9', '3.10', '3.11')

    - name: Install Python dependencies and build
      # Combine all build steps into one 'run' block to ensure clean state and proper execution flow
      # This step will run the build_linux.sh script
      run: |
        # Make the build script executable
        chmod +x build_scripts/build_linux.sh
        # Execute the build script
        ./build_scripts/build_linux.sh
      # The 'continue-on-error: true' is CRUCIAL here.
      # It allows the workflow to proceed to the artifact upload step even if the build_linux.sh script fails (e.g., due to the test run failing).
      continue-on-error: true

    - name: Upload MiFlashX executable as artifact (even if build/test failed)
      uses: actions/upload-artifact@v4 # Action to upload build artifacts
      if: always() # This condition ensures the step runs regardless of previous step's success or failure
      with:
        name: MiFlashX-Linux-Executable # Name of the artifact
        path: dist/MiFlashX             # Path to the compiled executable
        retention-days: 7               # How long to keep the artifact (e.g., 7 days)
